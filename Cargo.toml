[package]
name         = "upgrade"
version      = "0.1.0"
edition      = "2024"
rust-version = "1.85"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/LiGoldragon/upgrade"
description  = "Runtime scaffold for the upgrade triad."
publish      = false

[lib]
name = "upgrade"
path = "src/lib.rs"

[[bin]]
name = "upgrade"
path = "src/bin/upgrade.rs"

[[bin]]
name = "upgrade-daemon"
path = "src/bin/upgrade-daemon.rs"

[[bin]]
name = "upgrade-spirit-sandbox-test"
path = "src/bin/upgrade-spirit-sandbox-test.rs"

[features]
default = []
nota-text = ["dep:nota-next"]

[dependencies]
nota-next              = { git = "https://github.com/LiGoldragon/nota-next.git", branch = "main", optional = true }
nota-codec             = { git = "https://github.com/LiGoldragon/nota-codec.git", branch = "main" }
meta-signal-upgrade   = { git = "https://github.com/LiGoldragon/meta-signal-upgrade.git", branch = "main" }
rkyv                   = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
sema                   = { git = "https://github.com/LiGoldragon/sema.git" }
sema-engine            = { git = "https://github.com/LiGoldragon/sema-engine.git", branch = "main" }
signal-executor        = { git = "https://github.com/LiGoldragon/signal-executor.git", branch = "main" }
signal-frame           = { git = "https://github.com/LiGoldragon/signal-frame.git", branch = "main" }
signal-persona-spirit  = { git = "https://github.com/LiGoldragon/signal-persona-spirit.git", branch = "main" }
signal-sema            = { git = "https://github.com/LiGoldragon/signal-sema.git", branch = "main" }
signal-upgrade         = { git = "https://github.com/LiGoldragon/signal-upgrade.git", branch = "main" }
thiserror              = "2"
tokio                  = { version = "1", features = ["io-util", "net"] }
triad-runtime          = { git = "https://github.com/LiGoldragon/triad-runtime.git", branch = "main" }
version-projection     = { git = "https://github.com/LiGoldragon/version-projection.git", branch = "main" }

[dev-dependencies]
tempfile = "3"
tokio    = { version = "1", features = ["macros", "rt"] }

[build-dependencies]
schema-next = { git = "https://github.com/LiGoldragon/schema-next.git", branch = "main" }
schema-rust-next = { git = "https://github.com/LiGoldragon/schema-rust-next.git", branch = "main" }

[lints.rust]
unsafe_code = "forbid"
unused      = { level = "warn", priority = -1 }
dead_code   = "warn"
