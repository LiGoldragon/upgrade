[package]
name         = "upgrade"
version      = "0.1.0"
edition      = "2024"
rust-version = "1.85"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/LiGoldragon/upgrade"
description  = "Runtime scaffold for the upgrade triad."
publish      = false

[lib]
name = "upgrade"
path = "src/lib.rs"

[[bin]]
name = "upgrade"
path = "src/bin/upgrade.rs"

[[bin]]
name = "upgrade-daemon"
path = "src/bin/upgrade-daemon.rs"

[dependencies]
nota-codec           = { git = "https://github.com/LiGoldragon/nota-codec.git", branch = "main" }
owner-signal-upgrade = { git = "https://github.com/LiGoldragon/owner-signal-upgrade.git", branch = "main" }
signal-upgrade       = { git = "https://github.com/LiGoldragon/signal-upgrade.git", branch = "main" }
thiserror            = "2"

[lints.rust]
unsafe_code = "forbid"
unused      = { level = "warn", priority = -1 }
dead_code   = "warn"
